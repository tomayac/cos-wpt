# Keeps the two cross-origin mirrors in step with this site. Authentication is
# a per-repository write deploy key rather than a personal access token; both
# are installed by tools/setup-mirrors.sh. A target whose secret is missing is
# skipped, so this is a no-op until the mirrors exist.
name: Push to mirror origins

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: cos-wpt-remote/cos-wpt-remote.github.io
            secret: MIRROR_KEY_REMOTE
          - repo: cos-wpt-alt/cos-wpt-alt.github.io
            secret: MIRROR_KEY_ALT
    steps:
      - uses: actions/checkout@v4

      - name: Look for this mirror's deploy key
        id: key
        env:
          DEPLOY_KEY: ${{ secrets[matrix.secret] }}
        run: echo "present=${DEPLOY_KEY:+yes}" >> "$GITHUB_OUTPUT"

      - name: Push
        if: steps.key.outputs.present == 'yes'
        env:
          DEPLOY_KEY: ${{ secrets[matrix.secret] }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/mirror_key
          chmod 600 ~/.ssh/mirror_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null

          # The mirror is the site alone: this repository's own workflows and
          # tooling have no business running from it.
          rm -rf .git .github tools
          git init -q -b main
          git config user.name "cos-wpt mirror"
          git config user.email "cos-wpt@users.noreply.github.com"
          git add -A
          git commit -q -m "Mirror of ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
          GIT_SSH_COMMAND="ssh -i ~/.ssh/mirror_key -o IdentitiesOnly=yes" \
            git push -q --force "git@github.com:${{ matrix.repo }}.git" main
