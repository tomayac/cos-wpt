<!doctype html>
<meta charset="utf-8">
<title>cos-wpt bootstrap</title>
<!--
  Loaded in a hidden frame by the runner, once per configured origin. It
  registers that origin's service worker inside the current storage partition
  and reports back what scope it got, which is what decides whether the origin
  can serve root-absolute test paths.
-->
<body>
<pre id="log"></pre>
<script type="module">
const parentWindow = self.parent !== self ? self.parent : self.opener;

function report(payload) {
  document.getElementById('log').textContent =
      JSON.stringify(payload, null, 2);
  if (parentWindow) {
    parentWindow.postMessage(
        Object.assign({magic: 'cos-wpt-bootstrap'}, payload), '*');
  }
}

const config = await new Promise((resolve) => {
  const params = new URLSearchParams(location.search);
  const inline = params.get('config');
  if (inline) {
    resolve(JSON.parse(decodeURIComponent(inline)));
    return;
  }
  self.addEventListener('message', function onMessage(event) {
    if (event.data && event.data.magic === 'cos-wpt-configure') {
      self.removeEventListener('message', onMessage);
      resolve(event.data.config);
    }
  });
  if (parentWindow) {
    parentWindow.postMessage({magic: 'cos-wpt-bootstrap', type: 'awaiting-config'}, '*');
  }
});

try {
  if (!self.isSecureContext) throw new Error('not a secure context');
  if (!('serviceWorker' in navigator)) {
    throw new Error('service workers unavailable (private mode, or storage blocked in this frame)');
  }
  const registration = await navigator.serviceWorker.register(
      new URL('./sw.js', location.href), {scope: './'});
  await navigator.serviceWorker.ready;
  const worker = registration.active || registration.waiting || registration.installing;
  const channel = new MessageChannel();
  const acked = new Promise((resolve) => {
    channel.port1.onmessage = () => resolve(true);
  });
  worker.postMessage({type: 'cos-wpt:config', config}, [channel.port2]);
  await Promise.race([acked, new Promise((r) => setTimeout(r, 5000))]);
  const scope = new URL(registration.scope).pathname;
  report({
    type: 'ready',
    origin: location.origin,
    scope,
    rootScoped: scope === '/',
    controlled: !!navigator.serviceWorker.controller,
  });
} catch (error) {
  report({type: 'error', origin: location.origin, error: String(error && error.message || error)});
}
</script>
</body>
